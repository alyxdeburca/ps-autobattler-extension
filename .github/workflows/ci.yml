name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test decision pipeline
        run: npm test

      - name: Build & stage extension
        run: node tools/package.js

      - name: Upload loadable extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps-autobattler-extension-${{ github.sha }}
          path: dist-package/
          retention-days: 14
