<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <span class="title">PS Auto-Battler</span>
    <span class="ver" id="ver"></span>
  </header>

  <div id="state" class="state">checking tab…</div>

  <section id="advice" class="advice" hidden>
    <div class="subhead">Suggestions <span id="turn" class="turn"></span></div>
    <ol id="list" class="list"></ol>
  </section>

  <label class="auto-row">
    <input type="checkbox" id="autoplay">
    autoplay this battle
  </label>

  <footer class="foot">
    reads only what the client shows · no engine simulation
  </footer>

  <script src="../dist/popup.js"></script>
</body>
</html>
